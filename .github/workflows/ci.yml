name: CI

# Runs on every push and pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  infra-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt check
        working-directory: infra/environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend, validate only)
        working-directory: infra/environments/dev
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/environments/dev
        run: terraform validate

  backend-ci:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  frontend-ci:
    name: Frontend Lint & Test (placeholder)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Placeholder, frontend code is added in Week 7
        run: echo "Frontend CI steps will be added once the React app exists (Week 7)"
