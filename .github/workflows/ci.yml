name: CI

# Runs on every push and pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  infra-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt check
        working-directory: infra/environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend, validate only)
        working-directory: infra/environments/dev
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/environments/dev
        run: terraform validate

  backend-ci:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  backend-image:
    name: Backend Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t docmind-api backend

      - name: SQL Server driver loads (every library it needs is present)
        run: |
          docker run --rm -i docmind-api python - <<'PY'
          import pyodbc

          assert "ODBC Driver 18 for SQL Server" in pyodbc.drivers(), pyodbc.drivers()
          try:
              pyodbc.connect(
                  "DRIVER={ODBC Driver 18 for SQL Server};SERVER=tcp:127.0.0.1,1;"
                  "UID=a;PWD=b;Encrypt=yes;Connection Timeout=2",
                  timeout=2,
              )
          except pyodbc.Error as error:
              # Nothing listens there, so a refused connection is the expected result.
              # "Can't open lib" would mean the driver itself cannot load.
              assert "Can't open lib" not in str(error), error
              print("driver loads; connection refused as expected")
          PY

      - name: Container starts and answers /health
        run: |
          docker run -d --name api -p 8000:8000 docmind-api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  frontend-ci:
    name: Frontend Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  deploy-backend:
    name: Deploy Backend
    # Only after every check passes, only for pushes to main, and only once hosting exists
    needs: [infra-validate, backend-ci, backend-image, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sign in to Azure (no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the container registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push image
        run: |
          docker build -t "$REGISTRY/docmind-api:${{ github.sha }}" backend
          docker push "$REGISTRY/docmind-api:${{ github.sha }}"

      - name: Roll out the new image
        run: |
          az containerapp update \
            --name docmind-api \
            --resource-group docmind-rg \
            --image "$REGISTRY/docmind-api:${{ github.sha }}"

      - name: Check the live backend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.BACKEND_URL }}/health"; then exit 0; fi
            sleep 5
          done
          echo "The backend did not answer /health"
          exit 1

  deploy-frontend:
    name: Deploy Frontend
    needs: [infra-validate, backend-ci, backend-image, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build for the cloud
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.BACKEND_URL }}
          VITE_AUTH: entra
          VITE_ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          VITE_ENTRA_SUBDOMAIN: ${{ vars.ENTRA_SUBDOMAIN }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.ENTRA_WEB_CLIENT_ID }}
          VITE_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
        run: |
          npm ci
          npm run build

      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
